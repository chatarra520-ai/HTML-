<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Mis trabajos</title>
</head>
<style>
    :root {
        --fondo: #12131A;
        --title: #1D2030;
        --blanco: #ffffff;
        --contenido: #20243E;
        --border: #5C76FF;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--fondo);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    p {
        font-size: 20px;
    }

    h1 {
        text-align: center;
        color: var(--blanco);
        line-height: 2;
    }

    .contenedor {
        margin-top: 50px;
        display: flex;
        flex-direction: column;
        width: 50vw;
        height: 50vh;
    }

    .fila {
        padding: 10px 0 10px 0;
        border: 1px solid var(--border);
    }

    .fila-1 {
        background-color: var(--title);
        padding: 0px 30px 0px 30px;
    }

    .fila-2 {
        background-color: var(--contenido);
        padding: 0px 30px 0px 30px;
        color: var(--txt-title);
        line-height: 3;

    }

    a:link {
        color: var(--blanco);
        text-decoration: none;
    }

    a:visited {
        color: var(--blanco);
        text-decoration: none;
    }

    a:hover {

        color: #A7AFDA;
        text-decoration: none;
    }

    a:active {
        color: var(--blanco);
        text-decoration: none;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        position: relative;
        padding: 12px 12px 12px 30px;
        border-bottom: 1px solid #ccc;
    }

    li::before {
        content: "➜";
        position: absolute;
        left: 5px;
    }

   
</style>

<body>
    <div class="contenedor">
        <div class="fila fila-1">
            <h1>Mis trabajos</h1>
        </div>

        <div class="fila fila-2">
            <ul id="lista"></ul>
        </div>
    </div>
    <script>
        fetch("trabajos.json")
            .then(r => r.json())
            .then(trabajos => {
                const lista = document.getElementById("lista");
                trabajos.forEach(t => {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.href = t.ruta;
                    a.textContent = t.titulo;
                    li.appendChild(a);
                    lista.appendChild(li);
                });
            })
            .catch(() => {
                document.getElementById("lista").textContent = "No se pudo cargar trabajos.json";
            });
    </script>
</body>

</html>
