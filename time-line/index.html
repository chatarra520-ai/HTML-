<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timeline alterna con CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="timeline-grid">
        <div class="timeline-grid-items">
            <h3>2020</h3>
            <p>Inicio del proyecto.</p>
        </div>
        <div class="timeline-grid-items">
            <h3>2021</h3>
            <p>Primera versión pública.</p>
        </div>
        <div class="timeline-grid-items">
            <h3>2022</h3>
            <p>Llegamos a 1.000 usuarios.</p>
        </div>
        <div class="timeline-grid-items">
            <h3>2023</h3>
            <p>Nuevo equipo y nueva oficina.</p>
        </div>
        <div class="timeline-grid-items">
            <h3>2024</h3>
            <p>Lanzamiento de la v2.</p>
        </div>
    </div>
</body>

</html>
