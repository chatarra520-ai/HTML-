<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexbox: centrado y order</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Conexión anticipada con Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fuentes: Fraunces y Manrope -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=Manrope:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Manrope", sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .titulo {
            font-family: "Fraunces", serif;
            text-align: center;
            padding: 24px 16px;
        }

        .flex-container {
            list-style: none;
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: center;
            align-content: center;
            flex: 1;
        }

        .flex-item:nth-of-type(1) {
            order: 3;
        }

        .flex-item:nth-of-type(2) {
            order: 4;
        }

        .flex-item:nth-of-type(3) {
            order: 1;
        }

        .flex-item:nth-of-type(4) {
            order: 5;
        }

        .flex-item:nth-of-type(5) {
            order: 2;
        }

        .flex-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background: tomato;
            width: 100px;
            height: 100px;
            margin: 5px;
            color: white;
            font-weight: bold;
            font-size: 2em;
        }
    </style>

</head>

<body>

    <h1 class="titulo">Reordenar elementos con order</h1>

    <ul class="flex-container">
        <li class="flex-item">1</li>
        <li class="flex-item">2</li>
        <li class="flex-item">3</li>
        <li class="flex-item">4</li>
        <li class="flex-item">5</li>
    </ul>

    <!-- Bootstrap JS con Popper incluido (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
